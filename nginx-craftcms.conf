# TODO: What is really necessary here?
server {
    listen 80;
    server_name ${APP_URLCOOLIFY_URL};

    root /var/www/html/web;  # Serve files from the "web" directory inside CraftCMS
    index index.php index.html index.htm;

    # Main location block
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;  # Adjust to the version of PHP you’re using
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;
    }

    # Static file handling
    location ~* \.(jpg|jpeg|gif|css|png|js|ico|webp|svg|ttf|woff|woff2)$ {
        expires max;
        log_not_found off;
    }

    # Deny access to hidden files (like .htaccess)
    location ~ /\. {
        deny all;
    }
}
