worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name yourdomain.com;  # Replace with your domain or leave it as is for local testing

        root /var/www/html/web;  # Serve files from the "web" directory inside CraftCMS
        index index.php index.html index.htm;

        # Main location block
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP handling
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;  # Adjust to the version of PHP you’re using
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_intercept_errors on;
        }

        # Static file handling
        location ~* \.(jpg|jpeg|gif|css|png|js|ico|webp|svg|ttf|woff|woff2)$ {
            expires max;
            log_not_found off;
        }

        # Deny access to hidden files (like .htaccess)
        location ~ /\. {
            deny all;
        }
    }
}
